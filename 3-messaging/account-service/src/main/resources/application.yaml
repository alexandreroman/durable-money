spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/moneydb?currentSchema=account
    username: ${DB_USER:demo}
    password: ${DB_PASS:demo}
  sql:
    init:
      mode: always
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
  mvc:
    problemdetails:
      enabled: true
management:
  server:
    port: ${MANAGEMENT_PORT:9081}
server:
  port: ${PORT:9080}
logging:
  structured:
    format:
      console: ecs
