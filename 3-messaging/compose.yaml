services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moneydb
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    volumes:
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d moneydb"]
      interval: 10s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:4-management-alpine
    user: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: "money-cookie"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 3

  account-service:
    build: ./account-service
    environment:
      DB_HOST: postgres
      DB_USER: demo
      DB_PASS: demo
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9081/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: on-failure

  transfer-service:
    build: ./transfer-service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: demo
      DB_PASS: demo
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: on-failure

volumes:
  postgres-data:
