services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moneydb
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d moneydb"]
      interval: 10s
      timeout: 10s
      retries: 3

  temporal:
    image: temporalio/temporal
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

  account-service:
    build: ./account-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_USER: demo
      DB_PASS: demo
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9081/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: on-failure

  workflow:
    build: ./workflow
    ports:
      - "8080:8080"
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8081
      TEMPORAL_HOST: temporal
    depends_on:
      account-service:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: on-failure

volumes:
  postgres-data:
