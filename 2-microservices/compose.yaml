services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: accountdb
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d accountdb"]
      interval: 10s
      timeout: 10s
      retries: 3

  account-service:
    build: ./account-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_USER: demo
      DB_PASS: demo
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: on-failure

  transfer-service:
    build: ./transfer-service
    ports:
      - "8080:8080"
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8081
    depends_on:
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: on-failure

volumes:
  postgres-data:
