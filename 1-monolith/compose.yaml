services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moneydb
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d moneydb"]
      interval: 10s
      timeout: 10s
      retries: 3

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: demo
      DB_PASS: demo
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: on-failure

volumes:
  postgres-data:
