spring:
  application:
    name: durable-money-monolith
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/moneydb
    username: ${DB_USER:demo}
    password: ${DB_PASS:demo}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  mvc:
    problemdetails:
      enabled: true
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
server:
  port: ${PORT:8080}
logging:
  structured:
    format:
      console: ecs
