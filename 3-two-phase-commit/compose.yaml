services:
  postgres:
    image: postgres:17-alpine
    command: postgres -c max_prepared_transactions=50
    environment:
      POSTGRES_DB: moneydb
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    volumes:
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d moneydb"]
      interval: 10s
      timeout: 10s
      retries: 3

  account-service:
    build: ./account-service
    environment:
      DB_HOST: postgres
      DB_USER: demo
      DB_PASS: demo
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9081/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: on-failure

  transfer-service:
    build: ./transfer-service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: demo
      DB_PASS: demo
      ACCOUNT_SERVICE_URL: http://account-service:9080
    depends_on:
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: on-failure

volumes:
  postgres-data:
